name: Surveillance Catalogue Reemploi

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

jobs:
  verifier-catalogue:
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installation de Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Exécution du scraper
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scraper.py

      - name: Sauvegarde de l'état du catalogue
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Mise a jour du catalogue"
          file_pattern: memoire_catalogue.json
