name: Surveillance Catalogue Reemploi

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

jobs:
  verifier-catalogue:
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installation de Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Exécution du scraper
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scraper.py

      - name: Sauvegarde de l'état du catalogue
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add memoire_catalogue.json
          git diff --staged --quiet && exit 0
          git commit -m "Mise a jour du catalogue"
          BRANCH_TO_PUSH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"

          for i in 1 2 3; do
            if git pull --rebase origin "$BRANCH_TO_PUSH"; then
              git push origin "HEAD:$BRANCH_TO_PUSH" && exit 0
            fi
            git rebase --abort || true
            sleep 2
          done

          echo "Échec du push après 3 tentatives."
          exit 1
