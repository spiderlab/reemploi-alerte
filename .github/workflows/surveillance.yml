name: Surveillance Catalogue Reemploi

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

concurrency:
  group: verifier-catalogue-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verifier-catalogue:
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installation de Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Exécution du scraper
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scraper.py

      - name: Sauvegarde de l'état du catalogue
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add memoire_catalogue.json
          git diff --staged --quiet && exit 0
          BASE_HEAD="$(git rev-parse HEAD)"
          git commit -m "Mise a jour du catalogue"
          BRANCH_TO_PUSH="$GITHUB_REF_NAME"
          COMMIT_TO_PUSH="$(git rev-parse HEAD)"

          for i in 1 2 3; do
            git reset --hard "$COMMIT_TO_PUSH"
            git fetch origin "$BRANCH_TO_PUSH"
            if ! git rebase FETCH_HEAD; then
              git rebase --abort || true
              sleep 2
              continue
            fi
            git push origin "HEAD:$BRANCH_TO_PUSH" && exit 0
            sleep 2
          done

          git reset --hard "$BASE_HEAD"
          echo "Échec du push après 3 tentatives."
          exit 1
